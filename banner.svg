<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes glow {
      0%,100%{fill:#00ff41;text-shadow:0 0 10px #00ff41,0 0 20px #00ff41}
      50%{fill:#00cc33;text-shadow:0 0 5px #00ff41,0 0 15px #00ff41}
    }
    @keyframes type { from { width: 0 } to { width: 100% } }
    @keyframes scan { 0%{transform:translateY(-200px)} 100%{transform:translateY(200px)} }
    .bg { fill: #0D1117 }
    .scanline { fill: rgba(0,255,65,0.03); animation: scan 4s linear infinite }
    .glow { animation: glow 3s ease-in-out infinite }
    .cursor { animation: blink 1s step-end infinite }
    .typewriter { overflow: hidden; white-space: pre; animation: type 2s steps(40) 1s forwards; width: 0 }
    text { font-family: 'Courier New', 'Consolas', monospace }
    .line1 { fill: #00ff41; font-size: 14px }
    .line2 { fill: #00cc33; font-size: 13px }
    .dim { fill: #005511; font-size: 12px }
  </style>
  <rect class="bg" width="800" height="200" rx="4"/>
  <rect class="scanline" width="800" height="4"/>
  <text x="20" y="30" class="dim">KHAIRULBASHARI@PROFILE:~$</text>
  <text x="220" y="30" class="line1">./setup.sh</text>
  <text x="20" y="52" class="dim">[SYSTEM] Loading profile...</text>
  <text x="20" y="74" class="line2"> ╔═══════════════════════════════════════════════════╗</text>
  <text x="20" y="90" class="line2"> ║   _  __     _       _ _    _    _    _   ___     ║</text>
  <text x="20" y="106" class="line2"> ║  | |/ /__ _(_)_ __ (_) |__| |__| |__| | | __|   ║</text>
  <text x="20" y="122" class="line2"> ║  | ' // _` | | '  \| | '_ \ '_ \ / _` | | _|    ║</text>
  <text x="20" y="138" class="line2"> ║  |_|\_\__,_|_|_|_|_|_|_.__/ .__/_\__,_| |___|   ║</text>
  <text x="20" y="154" class="line2"> ║                           |_|           |___|     ║</text>
  <text x="20" y="170" class="line2"> ╚═══════════════════════════════════════════════════╝</text>
  <text x="20" y="190" class="dim">KHAIRULBASHARI@PROFILE:~$</text>
  <text x="200" y="190" class="glow">▮</text>
</svg>