<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="100%" height="100%">
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes glow {
      0%,100%{text-shadow:0 0 8px #00ff41,0 0 15px #00ff41,0 0 30px #00ff41}
      50%{text-shadow:0 0 4px #00ff41,0 0 8px #00ff41,0 0 15px #00ff41}
    }
    @keyframes glowRed {
      0%,100%{text-shadow:0 0 8px #ff0044,0 0 15px #ff0044}
      50%{text-shadow:0 0 4px #ff0044,0 0 8px #ff0044}
    }
    @keyframes scan { 0%{transform:translateY(-430px)} 100%{transform:translateY(430px)} }
    @keyframes rain { 0%{transform:translateY(-20px);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(430px);opacity:0} }
    @keyframes rain2 { 0%{transform:translateY(-60px);opacity:0} 10%{opacity:0.6} 90%{opacity:0.6} 100%{transform:translateY(430px);opacity:0} }
    @keyframes glitch1 {
      0%,100%{transform:translate(0)}
      4%{transform:translate(-3px,1px)}
      8%{transform:translate(3px,-1px)}
      12%{transform:translate(-2px,0)}
      16%{transform:translate(0)}
    }
    @keyframes glitch2 {
      0%,100%{transform:translate(0);opacity:0}
      4%{transform:translate(3px,-1px);opacity:0.8}
      8%{transform:translate(-3px,1px);opacity:0.6}
      12%{transform:translate(2px,0);opacity:0.4}
      16%{transform:translate(0);opacity:0}
    }
    @keyframes glitch3 {
      0%,100%{transform:translate(0);opacity:0}
      4%{transform:translate(-4px,2px);opacity:0.5}
      8%{transform:translate(4px,-2px);opacity:0.7}
      12%{transform:translate(-2px,1px);opacity:0.3}
      16%{transform:translate(0);opacity:0}
    }
    @keyframes trainMove { 0%{transform:translateX(-100px)} 100%{transform:translateX(1200px)} }
    @keyframes smoke { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-20px) scale(2)} }
    @keyframes progressFill { 0%{width:0} 100%{width:72%} }
    @keyframes statusCycle {
      0%,12%{opacity:0;transform:translateY(8px)}
      14%,26%{opacity:1;transform:translateY(0)}
      28%,40%{opacity:0;transform:translateY(-8px)}
      42%,55%{opacity:0;transform:translateY(8px)}
      56%,68%{opacity:1;transform:translateY(0)}
      70%,82%{opacity:0;transform:translateY(-8px)}
      84%,96%{opacity:1;transform:translateY(0)}
      98%,100%{opacity:0;transform:translateY(-8px)}
    }
    @keyframes flicker {
      0%,100%{opacity:1}
      3%{opacity:0.7}
      6%{opacity:1}
      7%{opacity:0.4}
      10%{opacity:1}
      50%{opacity:0.95}
      51%{opacity:0.5}
      53%{opacity:1}
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes nodeGlow { 0%,100%{opacity:0.4} 50%{opacity:1} }
    .bg { fill: #0a0a0a }
    .scanline { fill: rgba(0,255,65,0.02); animation: scan 5s linear infinite }
    text { font-family: 'Courier New', 'Consolas', monospace }
    .dim { fill: #006622; font-size: 11px }
    .dim2 { fill: #003300; font-size: 11px }
    .green { fill: #00ff41; font-size: 11px }
    .glitch-main { animation: glitch1 3s ease-in-out infinite, glow 2s ease-in-out infinite, flicker 8s infinite }
    .glitch-r { animation: glitch2 3s ease-in-out infinite, glowRed 2s ease-in-out infinite }
    .glitch-b { animation: glitch3 3s ease-in-out infinite }
    .cursor { animation: blink 1s step-end infinite }
    .train { animation: trainMove 10s linear infinite }
    .smoke { animation: smoke 0.8s ease-out infinite }
    .smoke2 { animation: smoke 1s ease-out infinite 0.3s }
    .tech-label { font-size: 10px; font-family: 'Courier New', monospace }
    .float { animation: float 3s ease-in-out infinite }
    .progress { animation: progressFill 5s ease-out 1s forwards }
    .status-anim { animation: statusCycle 18s infinite }
    .node { animation: nodeGlow 2s ease-in-out infinite }
    .r1 { animation: rain 2.5s linear infinite }
    .r2 { animation: rain2 3s linear infinite }
    .r3 { animation: rain 3.5s linear infinite }
    .r4 { animation: rain2 2.8s linear infinite }
    .r5 { animation: rain 4s linear infinite }
    .r6 { animation: rain2 3.2s linear infinite }
  </style>

