<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%">
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes glow {
      0%,100%{text-shadow:0 0 10px #00ff41,0 0 20px #00ff41,0 0 40px #00ff41}
      50%{text-shadow:0 0 5px #00ff41,0 0 10px #00ff41,0 0 20px #00ff41}
    }
    @keyframes trainMove { 0%{transform:translateX(-100px)} 100%{transform:translateX(1150px)} }
    @keyframes smoke { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-25px) scale(2)} }
    @keyframes scan { 0%{transform:translateY(-400px)} 100%{transform:translateY(400px)} }
    @keyframes progressFill { 0%{width:0} 100%{width:68%} }
    @keyframes statusCycle {
      0%,16%{opacity:0;transform:translateY(10px)}
      18%,32%{opacity:1;transform:translateY(0)}
      34%,49%{opacity:0;transform:translateY(-10px)}
      50%,66%{opacity:0;transform:translateY(10px)}
      67%,82%{opacity:1;transform:translateY(0)}
      83%,99%{opacity:0;transform:translateY(-10px)}
      100%{opacity:0}
    }
    @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes nodeGlow {
      0%,100%{opacity:0.3}
      50%{opacity:1}
    }
    .bg { fill: #0D1117 }
    .scanline { fill: rgba(0,255,65,0.025); animation: scan 4s linear infinite }
    text { font-family: 'Courier New', 'Consolas', monospace }
    .dim { fill: #005511; font-size: 11px }
    .dim2 { fill: #003300; font-size: 11px }
    .green { fill: #00ff41; font-size: 11px }
    .glow-text { animation: glow 2s ease-in-out infinite }
    .cursor { animation: blink 1s step-end infinite }
    .train { animation: trainMove 10s linear infinite }
    .smoke { animation: smoke 0.8s ease-out infinite }
    .smoke2 { animation: smoke 1s ease-out infinite 0.3s }
    .tech-label { font-size: 10px; font-family: 'Courier New', monospace }
    .pulse { animation: pulse 2s ease-in-out infinite }
    .float { animation: float 3s ease-in-out infinite }
    .progress { width: 68%; animation: progressFill 5s ease-out 1s forwards }
    .status-anim { animation: statusCycle 15s infinite }
    .node { animation: nodeGlow 2s ease-in-out infinite }
  </style>

  <rect class="bg" width="1100" height="400" rx="6"/>
  <rect class="scanline" width="1100" height="4"/>

  <text x="15" y="18" class="dim2">╔══════════════════════════════════════════════════════════════════════════════════════╗</text>
