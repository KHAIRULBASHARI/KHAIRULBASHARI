  <text x="195" y="32" class="dim2">$</text>
  <text x="205" y="32" class="green">./deploy.sh --tech kali,proxmox,ubuntu,debian,laravel,mysql,flutter</text>
  <text x="15" y="46" class="dim2">╚══════════════════════════════════════════════════════════════════════════════════════╝</text>

  <text x="15" y="64" class="dim2">│</text>
  <text x="25" y="64" class="title-line glow-text">W   W  AAA  L    K  K  EEEEE RRRR   888   888   000</text>
  <text x="15" y="78" class="dim2">│</text>
  <text x="25" y="78" class="title-line2">W   W A   A L    K K   E     R   R 8   8 8   8 0   0</text>
  <text x="15" y="92" class="dim2">│</text>
  <text x="25" y="92" class="title-line2">W W W AAAAA L    KK    EEE   RRRR   888   888  0   0</text>
  <text x="15" y="106" class="dim2">│</text>
  <text x="25" y="106" class="title-line2">W W W A   A L    K K   E     R  R  8   8 8   8 0   0</text>
  <text x="15" y="120" class="dim2">│</text>
  <text x="25" y="120" class="title-line2"> W W  A   A LLLLL K  K  EEEEE R   R  888   888   000</text>
  <text x="15" y="134" class="dim2">│</text>

  <text x="15" y="150" class="dim2">├══════════════════════════════════════════════════════════════════════════════════════┤</text>

  <text x="15" y="168" class="dim">│</text>
  <text x="25" y="168" class="dim">TECH TRAIN</text>
  <text x="90" y="168" class="dim2">[rolling...]</text>

  <line x1="50" y1="206" x2="1050" y2="206" stroke="#003300" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="50" y1="206" x2="1050" y2="206" stroke="#00ff41" stroke-width="1" opacity="0.08" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" from="0" to="-8" dur="0.5s" repeatCount="indefinite"/>
